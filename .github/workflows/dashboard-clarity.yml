name: BADANG dashboard clarity checks
on:
  push:
    branches: [badang-514-ui-clarity, badang-514-validation-ui-bridge]
  pull_request:
    paths:
      - badang_dashboard.py
      - badang_decision_427.py
      - tests/test_wave_structure.py
      - badang_position_scenarios.py
      - tests/test_position_scenarios.py
      - tests/test_divergence_order.py
      - tests/test_dashboard_clarity.py
      - .github/workflows/dashboard-clarity.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_dashboard_clarity.py' -v
      - run: python -m unittest discover -s tests -p 'test_wave_structure.py' -v
      - run: python -m unittest discover -s tests -p 'test_position_scenarios.py' -v
      - run: python -m unittest discover -s tests -p 'test_divergence_order.py' -v
      - run: python -m unittest discover -s tests -p 'test_stop_side.py' -v
      - run: python -m unittest discover -s tests -p 'test_indicator_reference.py' -v
      - run: python -m unittest discover -s tests -p 'test_closed_feed_integrity.py' -v
      - run: python -m unittest discover -s tests -p 'test_walkforward_audit.py' -v
      - run: python -m unittest discover -s tests -p 'test_confirmed_wave_pivots.py' -v
      - run: python -m unittest discover -s tests -p 'test_historical_integrity.py' -v
      - run: python -m unittest discover -s tests -p 'test_historical_replay.py' -v
      - run: python -m unittest discover -s tests -p 'test_historical_signal_adapter.py' -v
      - run: python -m unittest discover -s tests -p 'test_okx_history.py' -v
      - run: python -m unittest discover -s tests -p 'test_real_pivot_audit.py' -v

  collect-okx-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch actual OKX candles (failure recorded, not hidden)
        id: fetch
        continue-on-error: true
        run: python badang_collect_okx_research.py
      - name: Audit real OKX candles with existing BADANG indicators
        if: steps.fetch.outcome == 'success'
        id: indicators
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          python badang_research_audit.py
          python badang_real_pivot_audit.py
      - name: Upload provenance and failure manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-historical-research
          path: research-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Report collection status
        if: always()
        run: |
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "::warning::OKX historical collection failed; see manifest artifact. No real-data backtest can be claimed."
          fi
