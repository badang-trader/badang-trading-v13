name: BADANG OKX historical research collection
on:
  push:
    branches: [badang-514-validation-ui-bridge]
    paths:
      - badang_collect_okx_research.py
      - badang_okx_history.py
      - badang_historical_integrity.py
      - .github/workflows/okx-historical-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Fetch real OKX confirmed historical candles
        run: python badang_collect_okx_research.py
      - name: Preserve results and explicit failure manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-history-research-${{ github.run_id }}
          path: research-output/
          if-no-files-found: warn
          retention-days: 7
