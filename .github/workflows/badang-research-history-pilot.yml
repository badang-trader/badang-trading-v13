name: BADANG research history pilot (manual read-only)
on:
  workflow_dispatch:
  push:
    branches: [badang-514-validation]
    paths:
      - '.github/workflows/badang-research-history-pilot.yml'
permissions:
  contents: read
concurrency:
  group: badang-research-history-pilot
  cancel-in-progress: false
jobs:
  research-history-pilot:
    if: github.ref == 'refs/heads/badang-514-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BADANG_TRADING_ENABLED: 'false'
      DATABASE_URL: ''
      BADANG_OI_COLLECTOR_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install requests
      - name: Bounded Bitget historical research only
        run: python badang_research_history_pilot_583.py
      - name: Upload research-only coverage and latency
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badang-research-history-pilot
          path: badang-research-history-pilot.json
          if-no-files-found: warn
          retention-days: 14
