name: BADANG validation
on:
  push:
    branches: [badang-514-validation]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run discovered unittest suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation-results
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee validation-results/unittest.log
          # unittest can exit successfully even when discovery found zero tests.
          grep -Eq '^Ran [1-9][0-9]* tests? in ' validation-results/unittest.log
      - name: Publish test totals (even on failure)
        if: always()
        shell: bash
        run: |
          if [[ -f validation-results/unittest.log ]]; then
            {
              echo '### BADANG validation'
              echo "Commit: \`$GITHUB_SHA\`"
              echo "Branch: \`$GITHUB_REF_NAME\`"
              echo "Python: $(python --version 2>&1)"
              echo ''
              grep -E '^Ran [0-9]+ tests? in |^FAILED |^OK
              echo ''
              echo 'See the validation log artifact for individual failures.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'BADANG tests did not start; inspect dependency and syntax steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload validation logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badang-validation-logs
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
 validation-results/unittest.log | tail -n 3 || true
              echo ''
              echo 'See the validation log artifact for individual failures.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'BADANG tests did not start; inspect dependency and syntax steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload validation logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badang-validation-logs
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
