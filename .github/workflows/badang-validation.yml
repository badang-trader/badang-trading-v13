name: BADANG validation
on:
  push:
    branches: [badang-514-validation]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run discovered unittest suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation-results
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee validation-results/unittest.log
      - name: Upload validation logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badang-validation-logs
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
