name: BADANG validation
on:
  push:
    branches: [badang-514-validation]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run tests directory suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation-results
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee validation-results/tests-directory.log
          grep -Eq '^Ran [1-9][0-9]* tests? in ' validation-results/tests-directory.log
      - name: Run repository-wide suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s . -p 'test_*.py' -v 2>&1 | tee validation-results/repository-wide.log
          grep -Eq '^Ran [1-9][0-9]* tests? in ' validation-results/repository-wide.log
      - name: Publish test totals (even on failure)
        if: always()
        shell: bash
        run: |
          {
            echo '### BADANG validation'
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Branch: \`$GITHUB_REF_NAME\`"
            echo "Python: $(python --version 2>&1)"
            for f in validation-results/tests-directory.log validation-results/repository-wide.log; do
              echo ''
              echo "#### $f"
              if [[ -f "$f" ]]; then
                grep -E '^Ran [0-9]+ tests? in |^FAILED |^OK$' "$f" | tail -n 3 || true
              else
                echo 'Not executed; inspect preceding steps.'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation logs (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badang-validation-logs
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
